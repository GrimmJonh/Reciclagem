<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D.I.L.E - Login</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>

<div class="container">

    <div class="left-side">

        <div class="overlay">
            <h1>D.I.L.E</h1>
            <p>Descarte Inteligente de Lixo Eletrônico</p>
        </div>

    </div>

    <div class="login-box">

        <div class="logo">
            ♻ D.I.L.E
        </div>

        <h3>Conecte-se. Descarte. Transforme.</h3>

        <form>

            <div class="input-group">
                <i class="fa-regular fa-user"></i>
                <input type="text" placeholder="E-mail ou usuário">
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" placeholder="Senha">
            </div>

            <div class="options">
                <label>
                    <input type="checkbox">
                    Lembrar de mim
                </label>

                <a href="#">Esqueceu sua senha?</a>
            </div>

            <button type="submit">
                ENTRAR
            </button>

        </form>

        <div class="divider">
            ou
        </div>

        <button class="google-btn">
            <i class="fa-brands fa-google"></i>
            Entrar com Google
        </button>

        <div class="slogan">
            Menos lixo, mais futuro.
        </div>

    </div>

</div>

</body>
</html>
